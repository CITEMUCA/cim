<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Connexion — Administration CIM Marrakech</title>
  
  <link rel="icon" type="image/png" href="../assets/logo_cim-removebg-preview-1.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 20%, #1e293b 0%, #080d1a 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      color: #f8fafc;
    }
    .login-card {
      width: 100%;
      max-width: 440px;
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 2.5rem 2rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      text-align: center;
    }
    .login-logo {
      background: #ffffff;
      padding: 0.75rem 1.25rem;
      border-radius: 16px;
      display: inline-block;
      margin-bottom: 1.5rem;
      box-shadow: 0 8px 20px rgba(0,0,0,0.25);
    }
    .login-logo img {
      max-height: 55px;
      display: block;
    }
    h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 0.35rem;
    }
    p.desc {
      color: #94a3b8;
      font-size: 0.88rem;
      margin-bottom: 2rem;
    }
    .form-group {
      text-align: left;
      margin-bottom: 1.25rem;
    }
    label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      margin-bottom: 0.45rem;
      color: #cbd5e1;
    }
    .input-wrapper {
      position: relative;
    }
    .input-wrapper i {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: #64748b;
    }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 0.85rem 1rem 0.85rem 2.75rem;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      color: #ffffff;
      font-size: 0.95rem;
      transition: all 0.2s;
    }
    input:focus {
      outline: none;
      border-color: #0284c7;
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.25);
      background: rgba(15, 23, 42, 0.9);
    }
    .btn-submit {
      width: 100%;
      padding: 0.95rem;
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      border: none;
      border-radius: 12px;
      color: #ffffff;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 1.5rem;
      transition: all 0.25s;
      box-shadow: 0 10px 25px -5px rgba(2, 132, 199, 0.4);
    }
    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px -5px rgba(2, 132, 199, 0.6);
    }
    .alert-box {
      padding: 0.75rem 1rem;
      border-radius: 10px;
      font-size: 0.85rem;
      margin-bottom: 1.25rem;
      display: none;
    }
    .alert-error {
      background: rgba(225, 29, 72, 0.15);
      border: 1px solid rgba(225, 29, 72, 0.4);
      color: #fda4af;
    }
    .back-link {
      display: inline-block;
      margin-top: 1.5rem;
      color: #94a3b8;
      font-size: 0.85rem;
      text-decoration: none;
      transition: color 0.2s;
    }
    .back-link:hover {
      color: #ffffff;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="login-logo">
      <img src="../assets/logo_cim-removebg-preview-1.png" alt="CIM Logo" />
    </div>

    <h1>Espace d'Administration</h1>
    <p class="desc">Portail Cité de l'Innovation Marrakech</p>

    <div id="alertBox" class="alert-box alert-error"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="username">Identifiant Administrateur</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-user"></i>
          <input type="text" id="username" name="username" required placeholder="admin" autofocus />
        </div>
      </div>

      <div class="form-group">
        <label for="password">Mot de passe</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="password" name="password" required placeholder="••••••••" />
        </div>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">
        <span>Se connecter</span>
        <i class="fa-solid fa-arrow-right"></i>
      </button>
    </form>

    <a href="/" class="back-link">
      <i class="fa-solid fa-arrow-left"></i> Retour au portail public
    </a>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const alertBox = document.getElementById('alertBox');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Connexion...';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (data.success) {
          // Store token in localStorage as backup
          if (data.token) localStorage.setItem('cim_token', data.token);
          window.location.href = '/admin';
        } else {
          alertBox.textContent = data.error || "Identifiants incorrects.";
          alertBox.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<span>Se connecter</span> <i class="fa-solid fa-arrow-right"></i>';
        }
      } catch (err) {
        alertBox.textContent = "Erreur de connexion au serveur.";
        alertBox.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>Se connecter</span> <i class="fa-solid fa-arrow-right"></i>';
      }
    });
  </script>
</body>
</html>
